<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Study Check-In</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/door.css">
  <link rel="stylesheet" href="css/characters.css">
  <link rel="stylesheet" href="css/dialogue.css">
  <link rel="stylesheet" href="css/panels.css">
</head>
<body>
  <!-- Corner buttons and coins (door screen only) -->
  <nav class="side" aria-label="Menu">
    <button type="button" class="side-btn" data-panel="tasks-panel">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M3.5 6.5l1.5 1.5 3-3M3.5 12.5l1.5 1.5 3-3M3.5 18.5l1.5 1.5 3-3M11 6.5h9.5M11 12.5h9.5M11 18.5h9.5"/>
      </svg>
      Tasks
    </button>
    <div class="coin-badge" title="Your coins">
      <svg class="coin-icon" viewBox="0 0 20 20" aria-hidden="true">
        <circle cx="10" cy="10" r="9"/><circle class="coin-inner" cx="10" cy="10" r="5.5"/>
      </svg>
      <span data-coins>0</span>
      <span class="sr-only">coins</span>
    </div>
  </nav>

  <main class="app">
    <!-- The door scene is drawn into here by js/door.js -->
    <div id="stage" class="stage"></div>

    <!-- The study screen: shown while a session runs -->
    <section class="study" aria-label="Study session">
      <div id="clock" class="clock" role="timer">0:00</div>
      <p id="study-status" class="study-status" aria-live="polite"></p>
      <div class="study-buttons">
        <button id="break-btn" type="button" class="btn">Break</button>
        <button id="end-btn" type="button" class="btn btn-quiet">End session</button>
      </div>
      <ul id="session-tasks" class="session-tasks" aria-label="This session's tasks"></ul>
    </section>
  </main>

  <!-- Pop-up panels -->
  <div class="panel-backdrop"></div>

  <section id="tasks-panel" class="panel" role="dialog" aria-labelledby="tasks-title" hidden>
    <header class="panel-head">
      <h2 id="tasks-title">Tasks</h2>
      <button type="button" class="panel-close" aria-label="Close">×</button>
    </header>
    <form id="task-form" class="task-form">
      <input type="text" maxlength="80" placeholder="Add a task…" aria-label="New task">
      <button type="submit" class="btn">Add</button>
    </form>
    <p id="task-empty" class="panel-empty">Nothing here yet. Add your first task above.</p>
    <ul id="task-list" class="task-list"></ul>
  </section>

  <script type="module" src="js/main.js"></script>
</body>
</html>
